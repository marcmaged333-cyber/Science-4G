button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}

.frame{
  max-width:780px;margin-inline:auto;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (min-width:520px){.frame{padding-block:28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.sheet{
  background:var(--paper);
  min-height:calc(100dvh - 32px);
  padding:18px 18px 28px;
  display:flex;flex-direction:column;
  position:relative;
}
@media (min-width:520px){.sheet{min-height:calc(100dvh - 56px);padding:22px 28px 34px}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.logo{width:52px;height:auto;display:block}
.logo-link{display:inline-flex}

/* ---------- Home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center}
.home .title-img{width:min(88%,380px);height:auto;margin-top:clamp(12px,6vh,56px);display:block}
.home .spacer{flex:1;min-height:clamp(60px,24vh,260px)}
.home .img-btn{display:block;transition:transform .15s}
.home .img-btn img{display:block;height:auto}
.home .img-btn:hover{transform:scale(1.05) rotate(-1deg)}
.home .btn-explain img{width:136px}
.home .btn-challenge{margin-top:clamp(26px,6vh,60px)}
.home .btn-challenge img{width:min(86vw,380px)}

/* ---------- Sticker lettering ---------- */
.sticker{
  font-family:var(--display);
  font-weight:400;
  color:var(--orange);
  -webkit-text-stroke:7px var(--ink);
  paint-order:stroke fill;
  text-shadow:4px 4px 0 #a5a5a5, 6px 6px 0 #a5a5a5;
  line-height:1.15;
  letter-spacing:.01em;
  margin:0;
  text-wrap:balance;
}
.sticker.big{font-size:clamp(2.6rem,11vw,4.2rem)}
.sticker.mid{font-size:clamp(1.9rem,7.5vw,2.8rem)}
.heading-wrap{text-align:center;padding:10px 4px 6px}
.heading-wrap .sub{margin:12px 0 0;font-family:var(--body-en);font-weight:700;color:var(--ink-2);direction:ltr}

/* ---------- Dashed red buttons ---------- */
.dash-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:96px;padding:14px 12px;text-align:center;
  background:var(--red-deep);color:#fff;
  box-shadow:0 0 0 5px var(--red-edge);
  margin:5px;
  font-family:var(--display);font-size:1.75rem;line-height:1.2;
  transition:transform .15s;
}
.dash-btn::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,255,255,.85);pointer-events:none}
.dash-btn::after{
  content:"";position:absolute;inset:-5px;pointer-events:none;
  background:
    linear-gradient(var(--red-edge),var(--red-edge)) left top/12px 12px no-repeat,
    linear-gradient(var(--red-edge),var(--red-edge)) right top/12px 12px no-repeat,
    linear-gradient(var(--red-edge),var(--red-edge)) left bottom/12px 12px no-repeat,
    linear-gradient(var(--red-edge),var(--red-edge)) right bottom/12px 12px no-repeat;
}
.dash-btn:hover{transform:translateY(-2px)}
.dash-btn small{font-family:var(--body-en);font-weight:700;font-size:.85rem;opacity:.92;letter-spacing:.04em}
.dash-btn .meta{font-family:var(--body-ar);font-weight:600;font-size:.9rem;opacity:.95}
.dash-btn .soon{
  position:absolute;z-index:1;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);
  background:var(--yellow);color:var(--ink);
  font-family:var(--body-ar);font-weight:900;font-size:.8rem;padding:1px 12px;white-space:nowrap;
  clip-path:polygon(0 12%,6% 0,20% 10%,40% 0,62% 9%,84% 0,100% 12%,96% 88%,80% 100%,58% 90%,36% 100%,14% 90%,3% 100%);
}
.dash-btn.small{min-height:54px;font-size:1.2rem;padding:8px 18px}
.dash-btn.small::before{inset:5px}

.unit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 18px;padding:26px 6px 10px}
@media (min-width:640px){.unit-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- Lesson list ---------- */
.lesson-list{display:flex;flex-direction:column;gap:18px;padding:22px 4px 6px;margin:0;list-style:none}
.lesson-card{
  display:flex;align-items:center;gap:14px;
  border:3px solid var(--ink);background:var(--paper);padding:14px 16px;
  box-shadow:6px 6px 0 var(--yellow);transition:transform .15s,box-shadow .15s;
}
.lesson-card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--yellow)}
.lesson-no{
  flex:none;min-width:52px;height:52px;padding:0 8px;display:grid;place-items:center;
  background:var(--red-deep);color:#fff;font-family:var(--display);font-size:1.5rem;
}
.lesson-card .txt{min-width:0;flex:1}
.lesson-card .t-en{display:block;direction:ltr;text-align:left;font-family:var(--body-en);font-weight:800;font-size:1.08rem;line-height:1.3;overflow-wrap:anywhere}
.lesson-card .t-ar{display:block;font-weight:700;color:var(--ink-2);font-size:.98rem}

/* ---------- Lesson content ---------- */
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{
  border:2px solid var(--ink);padding:3px 14px;font-weight:700;font-size:.9rem;background:var(--paper);
}
.toggle[aria-pressed="true"]{background:var(--yellow)}
.lesson-head{padding:14px 0 6px;text-align:center}
.lesson-head .chip{display:inline-block;font-family:var(--body-en);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;background:var(--yellow);padding:2px 12px;margin-bottom:10px;border:2px solid var(--ink)}
.lesson-head .en-title{font-family:var(--body-en);font-weight:800;font-size:1.25rem;direction:ltr;margin:14px 0 0;text-wrap:balance}

.sec{margin-top:30px}
.sec-band{
  background:var(--ink);color:#fff;padding:9px 18px 10px;margin:0 -6px 16px;
  clip-path:polygon(0 8%,2% 0,98% 6%,100% 0,99% 92%,100% 100%,3% 94%,0 100%);
}
.sec-band .en{font-family:var(--body-en);font-weight:800;font-size:1.1rem;direction:ltr;text-align:left;margin:0}
.sec-band .ar{font-weight:700;font-size:.95rem;margin:0;opacity:.9;direction:rtl;text-align:right}
.sec.act .sec-band{background:var(--red-deep)}
.sec.act .sec-band .tag{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--body-en);font-weight:800;font-size:.75rem;padding:0 8px;margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}

.blocks{display:flex;flex-direction:column;gap:16px}
.bi{min-width:0}
.en{direction:ltr;text-align:left;font-family:var(--body-en);font-size:1.06rem;line-height:1.6;margin:0;overflow-wrap:anywhere}
.ar{direction:rtl;text-align:right;font-family:var(--body-ar);font-size:.98rem;line-height:1.75;color:var(--ink-2);margin:2px 0 0}
body.no-ar .ar{display:none}

.def{border:2px solid #9fc3de;background:var(--mist);padding:12px 16px;border-radius:12px}
.def .q{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin:0 0 6px}
.def .q b{font-family:var(--body-en);color:var(--red-deep);font-weight:800}
.def .q .term{font-family:var(--body-en);color:var(--blue);font-weight:800}
.def .qa{direction:rtl;font-weight:700;font-size:.95rem;color:var(--ink-2);margin:0 0 8px}
.def .qa b{color:var(--red-deep)}

.gr{border-inline-start:0;background:#fffbe3;border:2px solid #efd96a;padding:12px 16px;border-radius:12px}
.gr .tag{
  display:inline-flex;gap:8px;align-items:center;direction:ltr;
  font-family:var(--body-en);font-weight:800;background:var(--yellow);padding:1px 10px;border-radius:6px;margin-bottom:8px;font-size:.92rem;
}
.gr .tag i{font-style:normal;color:var(--red-deep)}
.gr .tag span{font-family:var(--body-ar);font-weight:700;font-size:.85rem;border-inline-start:2px solid var(--ink);padding-inline-start:8px}
.gr .ans .en{color:var(--blue);font-weight:600}

ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.list li{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding:6px 14px;border-radius:10px;background:#f6f6f4}
ul.list.chips{flex-direction:row;flex-wrap:wrap}
ul.list.chips li{padding:6px 14px}

ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;background:#fff}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#2a78c8;color:#fff;font-family:var(--body-en);font-weight:800}

.flow{direction:ltr;display:flex;flex-wrap:wrap;align-items:stretch;gap:10px 30px;justify-content:center}
.flow .node{position:relative;border:2px dashed #7aa7c9;border-radius:20px;padding:10px 20px;text-align:center;background:#fff;min-width:110px}
.flow .node:not(:last-child)::after{content:"";position:absolute;right:-24px;top:50%;width:18px;height:12px;transform:translateY(-50%);background:#7aa7c9;clip-path:polygon(0 25%,60% 25%,60% 0,100% 50%,60% 100%,60% 75%,0 75%)}
.flow .node .en{text-align:center;font-weight:800}
.flow .node .ar{text-align:center}

.cmp,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.panel{border:2px solid var(--ink);border-radius:14px;padding:14px 16px;background:#fff;min-width:0}
.panel.a{border-color:#4aa04a;background:#f3faf1}
.panel.b{border-color:#c98a1b;background:#fff8ea}
.panel h3{margin:0 0 8px}
.panel h3 .en{font-weight:800;font-size:1.02rem}
.panel h3 .ar{font-weight:700;color:var(--ink)}
.panel ul.list li{background:rgba(255,255,255,.75)}
.card-head{display:flex;align-items:flex-start;gap:10px}

.place{border:2px solid #9fc3de;border-radius:14px;background:var(--mist);padding:14px 16px}
.place .head{display:flex;gap:12px;align-items:flex-start}
.place .n{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#2a78c8;color:#fff;font-family:var(--body-en);font-weight:800}
.place .sub-h{font-family:var(--body-en);font-weight:800;color:var(--blue);margin:12px 0 4px;direction:ltr}
.place .box{background:#fff;border-radius:10px;padding:8px 12px;margin-top:6px}

.tbl{border-radius:14px;overflow:hidden;border:2px solid #2a78c8}
.tbl-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);border-top:1px dashed #9fc3de}
.tbl-row:first-child{border-top:0}
.tbl-head{background:#2a78c8;color:#fff}
.tbl-head .en,.tbl-head .ar{color:#fff;font-weight:800}
.tbl-cell{padding:10px 14px;min-width:0}
.tbl-cell + .tbl-cell{background:var(--mist)}
.tbl-cell .en.name{font-weight:800}
.tbl-cell ul.list{gap:6px}
.tbl-cell ul.list li{padding:4px 10px;background:#fff}

.note{border-radius:12px;padding:12px 16px;border:2px dashed var(--red-deep);background:#fff6f4}
.note .lab{display:inline-block;font-family:var(--body-en);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--red-deep);padding:0 10px;margin-bottom:6px}
.note.illus{border-color:#8a8a8a;background:#f7f7f7}.note.illus .lab{background:#555}
.note.remember{border-color:#d9a400;background:#fffbe3}.note.remember .lab{background:#9a7400}
.note.take{border-color:var(--blue);background:var(--mist)}.note.take .lab{background:var(--blue)}
.note.conclude{border-color:#2f8a3f;background:#f1faf2}.note.conclude .lab{background:#2f8a3f}

.vocab{margin-top:34px}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px 10px}
.word{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:#f1f1ee;border-radius:10px;padding:6px 12px;min-width:0}
.word .e{font-family:var(--body-en);font-weight:700;direction:ltr;overflow-wrap:anywhere}
.word .a{font-weight:700;color:var(--red-deep);text-align:right;direction:rtl}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px}

/* ---------- Coming soon overlay ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(23,23,23,.55)}
.overlay[hidden]{display:none}
.soon-card{
  position:relative;width:min(92vw,420px);background:var(--paper);padding:34px 24px 26px;text-align:center;
  border:6px solid var(--red);box-shadow:0 0 0 4px #fff,0 18px 40px rgba(0,0,0,.35);
}
.brush{
  display:inline-block;background:var(--yellow);padding:10px 44px 14px;margin:6px 0 14px;transform:rotate(-2deg);
  clip-path:polygon(0 14%,4% 4%,18% 10%,36% 0,58% 8%,80% 0,96% 8%,100% 22%,97% 60%,100% 86%,92% 98%,70% 92%,48% 100%,24% 93%,6% 100%,0 80%,3% 50%);
}
.brush span{font-family:var(--display);font-size:clamp(2.3rem,10vw,3.2rem);line-height:1.2;color:var(--ink)}
.soon-card p{margin:0 0 18px;font-weight:700;color:var(--ink-2)}

const logoLink = `<a class="logo-link" href="#home" aria-label="الصفحة الرئيسية"><img class="logo" src="${IMG.logo}" alt=""></a>`;
const dashBtn = (href, label, small = "", cls = "") =>
  `<a class="dash-btn ${cls}" href="${href}">${label}${small}</a>`;

function pref(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

/* ---------- block renderers ---------- */
const R = {
  p: (b) => bi(b.en, b.ar),
  def: (b) => `<div class="def">
      <p class="q"><b>What is meant by</b><span class="term">${b.term}?</span></p>
      <p class="qa"><b>ماذا يُقصد بـ</b> ${b.termAr}؟</p>
      ${bi(b.en, b.ar)}</div>`,
  gr: (b) => `<div class="gr">
      <div class="tag"><i>G.R?</i><span>علل</span></div>
      ${bi(b.en, b.ar)}
      <div class="ans">${bi(b.aen, b.aar)}</div></div>`,
  ul: (b) => biList(b.items, b.items.length > 3 && b.items.every(([e]) => e.length < 24)),
  steps: (b) => `<ol class="steps">${b.items.map(([e, a]) => `<li>${bi(e, a)}</li>`).join("")}</ol>`,
  flow: (b) => `<div class="flow">${b.items.map(([e, a]) => `<div class="node">${bi(e, a)}</div>`).join("")}</div>`,
  note: (b) => {
    const labels = { illus: ["For illustration only", "للتوضيح فقط"], remember: ["Remember", "تذكّر"], caution: ["Caution", "تنبيه"], take: ["Take care", "انتبه"], conclude: ["Conclusion", "الاستنتاج"] };
    const [le, la] = labels[b.kind] || labels.take;
    const body = b.kind === "caution" && b.en === "Caution" ? "" : bi(b.en, b.ar);
    return `<div class="note ${b.kind}"><span class="lab">${le} · ${la}</span>${body}</div>`;
  },
  cmp: (b) => `<div class="cmp">
      <div class="panel a"><h3>${bi(b.a[0], b.a[1])}</h3>${biList(b.ai)}</div>
      <div class="panel b"><h3>${bi(b.b[0], b.b[1])}</h3>${biList(b.bi)}</div></div>`,
  cards: (b) => `<div class="cards">${b.items.map(([e, a, list]) => `<div class="panel"><h3>${bi(e, a)}</h3>${biList(list)}</div>`).join("")}</div>`,
  card: (b) => `<div class="panel"><h3>${bi((b.n ? b.n + ") " : "") + b.en, (b.n ? arNum(b.n) + ") " : "") + b.ar)}</h3>
      <div class="gr" style="margin-top:6px"><div class="tag"><i>G.R?</i><span>علل</span></div>${bi(b.grEn, b.grAr)}<div class="ans">${bi(b.aEn, b.aAr)}</div></div></div>`,
  place: (b) => `<div class="place">
      <div class="head"><span class="n">${b.n}</span><div class="bi">${bi(b.en, b.ar)}</div></div>
      <div class="gr" style="margin-top:10px"><div class="tag"><i>G.R?</i><span>علل</span></div><p class="en" dir="ltr">Because they are:</p><p class="ar" dir="rtl">لأنها:</p>
        <div class="box">${biList(b.because)}</div></div>
      <p class="sub-h">Such as: <span class="ar" style="display:inline;color:var(--ink-2)">مثل:</span></p>
      ${biList(b.such, true)}</div>`,
  tbl2: (b) => `<div class="tbl">
      <div class="tbl-row tbl-head"><div class="tbl-cell">${bi(b.h1[0], b.h1[1])}</div><div class="tbl-cell">${bi(b.h2[0], b.h2[1])}</div></div>
      ${b.rows.map(([e, a, places]) => `<div class="tbl-row"><div class="tbl-cell">${bi(e, a, "name")}</div><div class="tbl-cell">${biList(places)}</div></div>`).join("")}</div>`,
};

const renderBlock = (b) => (R[b.t] ? R[b.t](b) : "");

/* ---------- pages ---------- */
function pageHome() {
  return `<div class="topbar">${logoLink}</div>
  <div class="home">
    <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">للدرس</h1>
    <img class="title-img" src="${IMG.title}" alt="للدرس">
    <div class="spacer"></div>
    <a class="img-btn btn-explain" href="#units"><img src="${IMG.btn}" alt="شرح"></a>
    <button class="img-btn btn-challenge" type="button" data-soon="challenge"><img src="${IMG.chal}" alt="نمط التحدي"></button>
  </div>`;
}

function pageUnits() {
  const items = [];
  for (let i = 1; i <= UNIT_COUNT; i++) {
    const u = UNITS[i];
    if (u) {
      const n = u.lessons.length;
      const meta = n === 1 ? "درس واحد" : n === 2 ? "درسان" : `${arNum(n)} دروس`;
      items.push(dashBtn(`#unit-${i}`, `يونت ${arNum(i)}`, `<small>Unit ${i}</small><span class="meta">${meta}</span>`));
    } else {
      items.push(`<button class="dash-btn" type="button" data-soon="unit" data-unit="${i}">يونت ${arNum(i)}<small>Unit ${i}</small><span class="soon">قريبا</span></button>`);
    }
  }
  return `<div class="topbar">${logoLink}${dashBtn("#home", "رجوع", "", "small")}</div>
  <div class="heading-wrap"><h1 class="sticker big">الوحدات</h1></div>
  <div class="unit-grid">${items.join("")}</div>`;
}

function pageUnit(n) {
  const u = UNITS[n];
  if (!u) return pageUnits();
  const list = u.lessons.map((l, i) => `<li><a class="lesson-card" href="#lesson-${n}-${i + 1}">
      <span class="lesson-no">${arNum(l.no)}</span>
      <span class="txt"><span class="t-en" lang="en" dir="ltr">${l.en}</span><span class="t-ar">${l.ar}</span></span></a></li>`).join("");
  return `<div class="topbar">${logoLink}${dashBtn("#units", "رجوع", "", "small")}</div>
  <div class="heading-wrap"><h1 class="sticker big">يونت ${arNum(n)}</h1><p class="sub">Unit ${n}</p></div>
  <ul class="lesson-list">${list}</ul>`;
}

function pageLesson(n, k) {
  const u = UNITS[n];
  const l = u && u.lessons[k - 1];
  if (!l) return pageUnit(n);
  const secs = l.secs.map((s) => `<section class="sec${s.act ? " act" : ""}">
      <div class="sec-band">${s.act ? `<span class="tag">Activity · نشاط</span>` : ""}<p class="en" dir="ltr">${s.en}</p><p class="ar" dir="rtl">${s.ar}</p></div>
      <div class="blocks">${s.blocks.map(renderBlock).join("")}</div></section>`).join("");
  const vocab = l.vocab.map(([e, a]) => `<div class="word"><span class="e" lang="en">${e}</span><span class="a" lang="ar">${a}</span></div>`).join("");
  const prev = k > 1 ? dashBtn(`#lesson-${n}-${k - 1}`, "الدرس السابق", "", "small") : "<span></span>";
  const next = k < u.lessons.length ? dashBtn(`#lesson-${n}-${k + 1}`, "الدرس التالي", "", "small") : dashBtn(`#unit-${n}`, "كل الدروس", "", "small");
  const arOn = pref("lesson-ar") !== "off";
  document.body.classList.toggle("no-ar", !arOn);
  return `<div class="topbar crumb">${logoLink}<div class="tools">
      <button class="toggle" type="button" id="ar-toggle" aria-pressed="${arOn}">الترجمة العربية</button>
      ${dashBtn(`#unit-${n}`, "رجوع", "", "small")}</div></div>
  <header class="lesson-head">
    <span class="chip">Unit ${n} · Lesson ${l.no}</span>
    <h1 class="sticker mid">${l.ar}</h1>
    <p class="en-title" lang="en">${l.en}</p>
  </header>
  ${secs}
  <section class="vocab"><div class="sec-band"><p class="en" dir="ltr">Vocabulary</p><p class="ar" dir="rtl">المفردات</p></div><div class="vocab-grid">${vocab}</div></section>
  <nav class="pager" aria-label="التنقل بين الدروس">${next}${prev}</nav>`;
}

/* ---------- router ---------- */
function render() {
  const h = (location.hash || "#home").slice(1);
  let m;
  let html;
  document.body.classList.remove("no-ar");
  if ((m = h.match(/^lesson-(\d+)-(\d+)$/))) html = pageLesson(+m[1], +m[2]);
  else if ((m = h.match(/^unit-(\d+)$/))) html = pageUnit(+m[1]);
  else if (h === "units") html = pageUnits();
  else html = pageHome();
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------- coming soon ---------- */
function openSoon(kind, unit) {
  lastFocus = document.activeElement;
  document.getElementById("soon-msg").textContent =
    kind === "challenge" ? "نمط التحدي قيد التجهيز وسيكون متاحًا قريبًا." : `يونت ${arNum(unit)} قيد التجهيز وسيكون متاحًا قريبًا.`;
  overlay.hidden = false;
  document.getElementById("soon-close").focus();
}
function closeSoon() {
  overlay.hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.addEventListener("click", (e) => {
  const soon = e.target.closest("[data-soon]");
  if (soon) { openSoon(soon.dataset.soon, soon.dataset.unit); return; }
  if (e.target.closest("#ar-toggle")) {
    const btn = document.getElementById("ar-toggle");
    const on = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(on));
    document.body.classList.toggle("no-ar", !on);
    pref("lesson-ar", on ? "on" : "off");
    return;
  }
  if (e.target === overlay || e.target.closest("#soon-close")) closeSoon();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlay.hidden) closeSoon(); });
window.addEventListener("hashchange", render);

/* نسخة اللابتوب لا تعمل على الشاشات الصغيرة */
const MODE = "phone";
function checkGate() {
  if (MODE !== "laptop") return;
  const small = window.innerWidth < 900;
  document.getElementById("gate").hidden = !small;
  document.querySelector(".frame").hidden = small;
}
window.addEventListener("resize", checkGate);
checkGate();
render();
</script>

</body></html>
